<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StageBook Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex items-center justify-center px-6">
<div class="w-full max-w-sm">
  <h1 class="text-2xl font-black tracking-widest text-center mb-8">STAGEBOOK</h1>
  <form id="login-form" class="flex flex-col gap-4">
    <input id="name-input" placeholder="Name" autocapitalize="off" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-base text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-400" />
    <input id="password-input" type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-base text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-400" />
    <p id="error-msg" class="text-sm text-rose-400 hidden">Wrong name or password.</p>
    <button type="submit" class="w-full py-4 rounded-xl bg-amber-400 text-black text-lg font-bold active:bg-amber-500">Log In</button>
  </form>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const name = document.getElementById("name-input").value.trim();
  const password = document.getElementById("password-input").value;
  const errorMsg = document.getElementById("error-msg");
  errorMsg.classList.add("hidden");
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password })
    });
    if (res.ok) {
      window.location.href = "/";
    } else {
      errorMsg.classList.remove("hidden");
    }
  } catch (err) {
    errorMsg.classList.remove("hidden");
  }
});
</script>
</body>
</html>
